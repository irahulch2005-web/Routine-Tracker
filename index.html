<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Focus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1115;
  --surface:#181B21;
  --surface-2:#1E222A;
  --border:#262B34;
  --text:#ECEDEF;
  --text-dim:#9198A3;
  --text-faint:#5C6470;
  --font-display:'Space Grotesk', sans-serif;
  --font-body:'Inter', sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:
    radial-gradient(circle at 15% 0%, rgba(91,157,255,0.09) 0%, transparent 45%),
    radial-gradient(circle at 85% 15%, rgba(255,111,181,0.08) 0%, transparent 45%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  padding:36px 16px 60px;
  min-height:100vh;
}
.wrap{max-width:780px; margin:0 auto;}

.header{text-align:center; margin-bottom:28px;}
.header h1{font-family:var(--font-display); font-size:25px; margin:0 0 5px; letter-spacing:-0.01em;}
.header .date{color:var(--text-faint); font-size:13px; letter-spacing:.02em;}

.summary{
  display:flex; align-items:center; justify-content:center; gap:20px;
  margin-bottom:32px;
  background:linear-gradient(160deg, var(--surface-2), var(--surface));
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px 24px;
  box-shadow:0 8px 30px -12px rgba(0,0,0,0.5);
}
.summary-ring{position:relative; width:76px; height:76px; flex-shrink:0;}
.summary-ring svg{width:100%; height:100%; transform:rotate(-90deg);}
.summary-ring circle{fill:none; stroke-width:7;}
.summary-ring .track{stroke:#ffffff14;}
.summary-ring .fill{stroke:#5B9DFF; stroke-linecap:round; stroke-dasharray:213.6; stroke-dashoffset:213.6; transition:stroke-dashoffset .5s ease;}
.summary-text{text-align:left;}
.summary .big{font-family:var(--font-display); font-size:28px; font-weight:700; line-height:1;}
.summary .label{color:var(--text-dim); font-size:12.5px; margin-top:4px;}

.grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:16px;}
@media (max-width:560px){ .grid{grid-template-columns:1fr;} }

.card{
  background:linear-gradient(160deg, var(--surface-2) 0%, var(--surface) 65%);
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
  position:relative;
  overflow:hidden;
  box-shadow:0 6px 20px -14px rgba(0,0,0,0.6);
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  animation:cardIn .4s ease backwards;
}
.card::before{
  content:'';
  position:absolute; inset:0 0 auto 0; height:3px;
  background:var(--c);
}
.card:hover{ transform:translateY(-2px); box-shadow:0 12px 28px -14px rgba(0,0,0,0.7); border-color:color-mix(in srgb, var(--c) 40%, var(--border)); }
.card.is-done{ border-color:color-mix(in srgb, var(--c) 55%, var(--border)); }
@keyframes cardIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

.card-top{display:flex; align-items:center; gap:11px;}
.card-icon{
  width:38px; height:38px;
  border-radius:11px;
  background:color-mix(in srgb, var(--c) 24%, var(--surface));
  display:flex; align-items:center; justify-content:center;
  font-size:19px; flex-shrink:0;
  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent);
}
.card-name{font-weight:700; font-size:14.5px; flex:1; letter-spacing:-0.01em;}
.card-streak{font-size:10.5px; color:var(--text-faint); white-space:nowrap; font-weight:600;}
.card-streak.is-active{color:var(--c);}

.bar-track{height:9px; background:#00000055; border-radius:6px; overflow:hidden;}
.bar-fill{height:100%; background:linear-gradient(90deg, color-mix(in srgb, var(--c) 70%, white 0%), var(--c)); border-radius:6px; transition:width .3s ease; width:0%;}

.card-bottom{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.mins-label{font-family:var(--font-display); font-size:12.5px; font-weight:600; color:var(--text-dim);}
.mins-label.is-done{color:var(--c);}

.btn-row{display:flex; gap:6px;}
.qbtn{
  background:#ffffff0a;
  border:1px solid var(--border);
  color:var(--text-dim);
  font-size:11.5px;
  font-weight:600;
  padding:7px 10px;
  border-radius:20px;
  cursor:pointer;
  transition:background .15s, color .15s, border-color .15s;
}
.qbtn:hover{background:color-mix(in srgb, var(--c) 22%, transparent); color:var(--text); border-color:color-mix(in srgb, var(--c) 50%, var(--border));}
.qbtn.reset{color:var(--text-faint); margin-left:auto; background:none; border-color:transparent;}
.qbtn.reset:hover{background:none; color:var(--text-dim); border-color:transparent;}

.dots{display:flex; gap:5px; margin-top:2px;}
.dot{width:7px; height:7px; border-radius:50%; background:var(--border);}
.dot.full{background:var(--c); box-shadow:0 0 6px color-mix(in srgb, var(--c) 60%, transparent);}
.dot.partial{background:var(--c); opacity:.4;}
.dot.today{outline:1.5px solid var(--c); outline-offset:2px;}

.footer{
  display:flex; justify-content:center; gap:18px;
  margin-top:34px; font-size:12px; color:var(--text-faint);
}
.footer button{
  background:none; border:none; color:var(--text-faint);
  cursor:pointer; font-size:12px; text-decoration:none;
  font-family:inherit; border-bottom:1px solid var(--border);
  padding-bottom:1px;
  transition:color .15s, border-color .15s;
}
.footer button:hover{ color:var(--text-dim); border-color:var(--text-faint); }

.toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
  background:#242A33; border:1px solid var(--border); color:var(--text);
  padding:10px 18px; border-radius:12px; font-size:12.5px;
  box-shadow:0 8px 24px -8px rgba(0,0,0,0.6);
  opacity:0; pointer-events:none; transition:all .25s ease;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <h1>Daily Focus</h1>
    <div class="date" id="dateLabel">—</div>
  </div>

  <div class="summary">
    <div class="summary-ring">
      <svg viewBox="0 0 76 76">
        <circle class="track" cx="38" cy="38" r="34"/>
        <circle class="fill" id="summaryRing" cx="38" cy="38" r="34"/>
      </svg>
    </div>
    <div class="summary-text">
      <div class="big" id="summaryBig">0/6 hrs</div>
      <div class="label">logged today</div>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="footer">
    <button id="exportBtn">Export backup</button>
    <button id="importBtn">Import backup</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'dailyFocus_v1';

const HABITS = [
  {id:'study',      name:'Study',                         icon:'📖', color:'#5B9DFF'},
  {id:'gym',         name:'Gym',                            icon:'🏋️', color:'#FF6B6B'},
  {id:'memestiano',  name:'Memestiano',                     icon:'😂', color:'#FF6FB5'},
  {id:'genAlpha',    name:'Gen Alpha',                      icon:'🎯', color:'#B980F0'},
  {id:'backlog',     name:'Podcast / YouTube backlog',      icon:'🎧', color:'#FFD166'},
  {id:'instaCheck',  name:'Insta saved & archive check',    icon:'📱', color:'#4DD2C0'},
];
const TARGET_MIN = 60;

function pad(n){ return n<10 ? '0'+n : ''+n; }
function todayKey(){
  const d = new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function lastNDates(n){
  const arr = [];
  const now = new Date();
  for(let i=n-1;i>=0;i--){
    const d = new Date(now);
    d.setDate(now.getDate()-i);
    arr.push(d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()));
  }
  return arr;
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {days:{}};
  }catch(e){ return {days:{}}; }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }
  catch(e){ showToast('Could not save — storage may be full'); }
}

let STATE = loadState();

function ensureDay(ds){
  if(!STATE.days[ds]){
    const d = {};
    HABITS.forEach(h=> d[h.id]=0);
    STATE.days[ds] = d;
  }
  return STATE.days[ds];
}

let toastTimer;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 1800);
}

function addMinutes(habitId, mins){
  const d = ensureDay(todayKey());
  d[habitId] = Math.max(0, Math.min(TARGET_MIN, d[habitId] + mins));
  saveState();
  render();
  if(d[habitId] >= TARGET_MIN) showToast(HABITS.find(h=>h.id===habitId).name + ' — full hour logged.');
}
function resetHabit(habitId){
  const d = ensureDay(todayKey());
  d[habitId] = 0;
  saveState();
  render();
}

function streakFor(habitId){
  let streak = 0;
  let cursor = new Date();
  while(true){
    const ds = cursor.getFullYear()+'-'+pad(cursor.getMonth()+1)+'-'+pad(cursor.getDate());
    const val = STATE.days[ds] ? STATE.days[ds][habitId] : 0;
    if(val >= TARGET_MIN){ streak++; cursor.setDate(cursor.getDate()-1); }
    else break;
  }
  return streak;
}

function render(){
  const now = new Date();
  document.getElementById('dateLabel').textContent = now.toLocaleDateString('en-US', {weekday:'long', month:'short', day:'numeric'});

  const ds = todayKey();
  const day = ensureDay(ds);
  const totalMins = HABITS.reduce((a,h)=> a+day[h.id], 0);
  const hrs = (totalMins/60);
  document.getElementById('summaryBig').textContent = (Math.round(hrs*10)/10) + '/' + HABITS.length + ' hrs';
  const ringCircumference = 213.6;
  const ringPct = Math.min(1, totalMins/(HABITS.length*TARGET_MIN));
  document.getElementById('summaryRing').style.strokeDashoffset = ringCircumference*(1-ringPct);

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const history = lastNDates(7);

  HABITS.forEach((h,idx)=>{
    const mins = day[h.id];
    const pct = Math.min(100, Math.round((mins/TARGET_MIN)*100));
    const streak = streakFor(h.id);

    const card = document.createElement('div');
    card.className = 'card' + (mins>=TARGET_MIN ? ' is-done' : '');
    card.style.setProperty('--c', h.color);
    card.style.animationDelay = (idx*0.05)+'s';

    const dotsHtml = history.map(hd=>{
      const v = STATE.days[hd] ? STATE.days[hd][h.id] : 0;
      const cls = v>=TARGET_MIN ? 'full' : (v>0 ? 'partial' : '');
      const todayCls = hd===ds ? 'today' : '';
      return `<span class="dot ${cls} ${todayCls}"></span>`;
    }).join('');

    card.innerHTML = `
      <div class="card-top">
        <div class="card-icon">${h.icon}</div>
        <div class="card-name">${h.name}</div>
        <div class="card-streak ${streak>0?'is-active':''}">${streak>0 ? streak+'d streak' : ''}</div>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="card-bottom">
        <div class="mins-label ${mins>=TARGET_MIN?'is-done':''}">${mins} / ${TARGET_MIN} min</div>
        <div class="dots">${dotsHtml}</div>
      </div>
      <div class="btn-row">
        <button class="qbtn" data-add="15">+15m</button>
        <button class="qbtn" data-add="30">+30m</button>
        <button class="qbtn" data-add="60">Full hour</button>
        <button class="qbtn reset">Reset</button>
      </div>
    `;
    card.querySelectorAll('.qbtn[data-add]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const add = parseInt(btn.dataset.add);
        if(add===60) addMinutes(h.id, TARGET_MIN - mins);
        else addMinutes(h.id, add);
      });
    });
    card.querySelector('.qbtn.reset').addEventListener('click', ()=> resetHabit(h.id));

    grid.appendChild(card);
  });
}

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(STATE,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'daily-focus-backup-'+todayKey()+'.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Backup exported');
});
document.getElementById('importBtn').addEventListener('click', ()=> document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      STATE = JSON.parse(reader.result);
      if(!STATE.days) STATE.days = {};
      saveState();
      render();
      showToast('Backup imported');
    }catch(err){
      showToast('Invalid backup file');
    }
  };
  reader.readAsText(file);
});

render();
</script>
</body>
</html>
